name: lxai_app
description: "LxAI - a cross-platform native AI assistant powered by Flutter: multi-provider LLMs, reasoning chains, and a local agent bridge."
publish_to: 'none'
version: 1.0.1+101

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Material
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Markdown and Syntax Highlighting
  flutter_markdown: ^0.7.3
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

  # State Management
  provider: ^6.1.2

  # Network & SSE Streaming
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  http: ^1.2.1

  # Local Persistent Storage (SQLite-like NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utility & Hardware
  uuid: ^4.4.0
  intl: ">=0.19.0 <=0.20.4"
  flutter_spinkit: ^5.2.1
  flutter_animate: ^4.5.0
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  # 纯 Dart 图像编解码：头像/背景图在**上传前**压成小尺寸 JPEG。
  # 为什么必须压：这些字段跟着设置上云，历史上一张头像 base64 达 6.14 MB，
  # 每次改设置都要整包上传 6.6 MB → 中继设置写锁被占住（桥接归属反查 403、
  # App 推送 2 分钟超时、SSE 被拖断）。它本来就是 image_picker 的传递依赖，
  # 这里显式声明以便直接调用（不新增下载）。
  image: ^4.10.1
  record: ^5.2.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.2
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^22.3.1
  tray_manager: ^0.7.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/scripts/
    # 许可全文与署名：Apache-2.0 §4 要求随分发提供许可副本，
    # 内容与仓库根目录 LICENSE / NOTICE 保持一致（改动时两边一起改）
    - assets/legal/
    # Windows 托盘 4 态图标（idle/message/question/offline）
    - assets/icons/tray/

