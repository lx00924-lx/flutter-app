name: deepseek_chat_app
description: "A cross-platform native AI assistant powered by Flutter, supporting DeepSeek, multiple LLMs, reasoning chains, and local bridge."
publish_to: 'none'
version: 1.0.1+101

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Material
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Markdown and Syntax Highlighting
  flutter_markdown: ^0.7.3
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

  # State Management
  provider: ^6.1.2

  # Network & SSE Streaming
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  http: ^1.2.1

  # Local Persistent Storage (SQLite-like NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utility & Hardware
  uuid: ^4.4.0
  intl: ">=0.19.0 <=0.20.4"
  flutter_spinkit: ^5.2.1
  flutter_animate: ^4.5.0
  path_provider: ^2.1.3
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
