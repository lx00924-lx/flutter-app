    <!--
      Cloudflare Turnstile（注册页的人机验证）。
      异步加载：RegisterModal 里会轮询等 window.turnstile 就绪再显式渲染，
      所以这里用 async defer 即可，不会阻塞首屏。
      site key 走构建期环境变量 VITE_TURNSTILE_SITE_KEY（见 src/components/RegisterModal.tsx）。
    -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
